# SOURCE: Bug — postgresql://cloudsql_iam_auth:@/mod_payments?host=...
#   The :@ (empty password between colon and at-sign) breaks Prisma's URL parser.
#   It's NOT "no password" — it's "empty string password" which Prisma cannot handle.
#
# Affects ALL database drivers: Prisma, SQLAlchemy, Django, GORM, Diesel, etc.
# Valid patterns: user:pass@host, user@host (no password slot)
# Broken pattern:  user:@host (empty password slot)
#
# Regex: ://[^@]*:@ — matches protocol:// ... :@ (empty password slot)

id: no-empty-password-db-url
language: typescript
severity: error
message: "Empty password slot in database URL (user:@host) — breaks Prisma/ORM parsers. Remove ':' or add a password."
note: |
  Catches database connection strings with an empty password slot: :@
  The :@ means "empty string password" not "no password".
  Prisma and many ORM parsers cannot handle this.

  BAD:
    postgresql://cloudsql_iam_auth:@/db?host=/cloudsql
    postgresql://user:@localhost:5432/db
    mysql://root:@localhost/db

  GOOD:
    postgresql://cloudsql_iam_auth@/db?host=/cloudsql     (no password slot)
    postgresql://user:secret@localhost:5432/db             (has password)
    postgresql://user@localhost:5432/db                    (no password slot)

  Fix:
    - If IAM auth or no password needed: remove the ':' before '@'
    - If password is required: add it between ':' and '@'

rule:
  kind: string
  regex: '://[^@]*:@'

ignores:
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - '**/*.spec.ts'
  - '**/*.spec.tsx'
  - '**/test/**'
  - '**/tests/**'
  - '**/__tests__/**'
  - '**/node_modules/**'
  - '**/.env.example'
  - '**/.env.local'
  - '**/fixtures/**'
  - '**/seed.ts'
  - '**/mock*/**'
