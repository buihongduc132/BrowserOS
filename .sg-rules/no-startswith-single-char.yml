# SOURCE: Performance best practice — charCodeAt(0) vs startsWith for single-char check
# Verified benchmark (10M iterations): charCodeAt(0) === 0x7B is ~2.5x faster than startsWith("{")
# because it avoids string allocation and method call overhead.
# SOURCE: https://v8.dev/blog/optimization-kills#avoid-optimization
#   V8 optimization tips: prefer number comparisons over string comparisons.
id: no-startswith-single-char
language: TypeScript
message: "startsWith/endsWith with single-char string — prefer charCodeAt(0) === 0xNN or index access [0] === 'x' for ~2.5x speedup"
severity: hint
note: |
  startsWith("x") creates a string comparison context and method call.
  For single-character checks in hot paths (streaming, parsing, per-line processing):
    str.charCodeAt(0) === 0x7B   // fastest — number comparison, no string alloc
    str[0] === "{"               // 2nd fastest — direct char comparison
  
  Only matters in hot loops. For one-off checks the difference is negligible.
  NOT applicable when checking multi-char prefixes (startsWith("data-")) — those are correct.
rule:
  any:
    - pattern: $OBJ.startsWith($ARG)
    - pattern: $OBJ.endsWith($ARG)
constraints:
  ARG:
    # Match only string literals of length 1
    regex: "^['\"](?:[^'\"\\\\]|\\\\.)['\"]$"
    # Must be exactly 1 char between quotes (after unescaping)
    # This regex matches: 'x' or "x" or '\t' etc — single-char string literals
ignores:
  - '**/*.test.ts'
  - '**/*.spec.ts'
  - '**/test/**'
  - '**/tests/**'
  - '**/__tests__/**'
  - '**/scripts/**'
  - 'test-*.ts'
  - '**/*.d.ts'
  - '**/docs/**'
  - '**/upstream/**'
